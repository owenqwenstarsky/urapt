services:
  urapt-server:
    build: .
    image: urapt-server:latest
    ports:
      - "8080:8080"
    volumes:
      - urapt-data:/data
    environment:
      URAPT_BIND: "0.0.0.0:8080"
      URAPT_BASE_URL: "http://localhost:8080"
      URAPT_STORE_DIR: "/data/store"
      # URAPT_OPEN_REGISTRATION: "true"
      # URAPT_SIGNING_KEY_USER_ID: "urapt-server <apt.example.com>"
    restart: unless-stopped

volumes:
  urapt-data:
